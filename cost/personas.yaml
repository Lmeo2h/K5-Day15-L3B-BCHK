# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản
  low: 500
  base: 2000
  high: 10000
  source: "(tự ước tính) số người dùng mỗi tháng; cần nguồn công khai về lượng khách tự túc từ TP.HCM đến Hà Nội trước CP4"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: xep_mot_lan
    share: 0.6
    uses_per_month: 1
    turns_per_session: 1
    source: "(tự ước tính) hỏi một lần cho một chuyến; thay bằng số khảo sát, câu 4"
  - name: sua_nhieu_lan
    share: 0.3
    uses_per_month: 1
    turns_per_session: 3
    source: "(tự ước tính) chỉnh yêu cầu vài lần trước ngày đi; thay bằng số phỏng vấn"
  - name: xep_lai_khi_di
    share: 0.1
    uses_per_month: 1
    turns_per_session: 5
    source: "(tự ước tính) xếp lại nhiều lần trong chuyến đi; thay bằng số phỏng vấn"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token — chép từ further-reading/model-prices.md của repo đề
  - model: gpt-5-nano
    input: 0.05
    output: 0.40
    source: "https://developers.openai.com/api/docs/pricing · BTC xem 25/11/2026"
  - model: gpt-5.4-mini
    input: 0.75
    output: 4.50
    source: "https://developers.openai.com/api/docs/pricing · BTC xem 25/11/2026"

usd_to_vnd:         # tuỳ chọn
  rate:
  source:
